<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>応募画像</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  /*
    応募フォームの 4 種の画像を、規定のピクセル寸法そのままで描く。
    ?v=icon | cover | clean | poster で 1 枚だけを表示する（tools/export.sh が使う）。
    ?id=3 のように標本番号を渡すと、その標本を主役にする（既定は 1 番）。
    icon と clean は「文字なし」が規定なので、人間の文字も架空の文字も入れない。
  */
  :root { --paper: #f4efe4; --ink: #2b2520; --ink-soft: #6d6257; --rule: #b9ad9c; --plate: #ebe3d3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #888; }
  body { font-family: "Shippori Mincho", serif; color: var(--ink); }
  body.single { background: var(--paper); }
  .sheet { position: relative; background: var(--paper); overflow: hidden; margin: 24px auto; }
  body.single .sheet { margin: 0; }
  .label { font: 13px/1 sans-serif; color: #fff; text-align: center; margin-top: 24px; }
  body.single .label { display: none; }

  /* 紙の質感：ごく薄い周辺の陰り */
  .sheet::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(80, 60, 30, .10) 100%); }

  .plate { position: absolute; background: var(--plate); border: 2px solid var(--rule); overflow: hidden; }
  .plate img { width: 100%; height: 100%; object-fit: cover; display: block; mix-blend-mode: multiply; }
  .plate.empty::before { content: ""; position: absolute; inset: 18%; border: 1px dashed var(--rule); }

  #icon, #icon_full, #icon_box, #icon_engraving, #icon_titled { width: 1024px; height: 1024px; }
  #cover, #clean, #cover_all, #clean_all, #cover_pair, #clean_pair { width: 1920px; height: 1080px; }
  #poster { width: 1000px; height: 1500px; }

  .title-v { position: absolute; writing-mode: vertical-rl; font-weight: 600; letter-spacing: .5em; }
  .title-en { position: absolute; font-family: "EB Garamond", serif; font-style: italic; color: var(--ink-soft); letter-spacing: .08em; }
  .glyph-name { position: absolute; }
  .glyph-name svg { width: 100%; height: auto; display: block; }
  .rule-v { position: absolute; width: 2px; background: var(--rule); }
</style>
</head>
<body>
<div id="sheets"></div>

<script src="../book/glyphs.js"></script>
<script src="../book/data/specimens.js" onerror="this.remove()"></script>
<script src="../book/mock-data.js"></script>
<script>
(function () {
  const G = window.Glyphs, D = window.HAKUBUTSUSHI;
  const q = new URLSearchParams(location.search);
  const only = q.get('v');
  const specs = D.specimens;
  const lead = specs.find((s) => String(s.id) === q.get('id')) || specs[0];
  const others = specs.filter((s) => s !== lead);
  const imgOf = (s, k = 0) => (s && s.images && s.images[k] ? `../book/data/${s.images[k]}` : null);
  // ?img=1 などで 1:1 に使う図版を選べる（0 は銅版画風。AI が描いた読めない書き込みを含むことがある）
  const iconImg = +(q.get('img') || 0);
  const nameOf = (s) => G.nameFromCoords(s.coords, G.speciesLengthFor(s.farness));
  const mean = (vs) => vs[0].map((_, i) => vs.reduce((a, v) => a + v[i], 0) / vs.length);

  const plate = (s, x, y, w, h, k = 0, style = '') => {
    const src = imgOf(s, k);
    return `<div class="plate${src ? '' : ' empty'}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${style}">${src ? `<img src="${src}" alt="">` : ''}</div>`;
  };
  // 図版の一部だけを切り抜いて置く。crop = [左, 上, 一辺]（図版の幅に対する割合）
  const croppedPlate = (s, x, y, w, h, crop) => {
    const src = imgOf(s, 0);
    if (!src) return plate(s, x, y, w, h);
    const [cx, cy, cs] = crop;
    return `<div class="plate" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">` +
      `<img src="${src}" alt="" style="position:absolute;width:${100 / cs}%;height:${100 / cs}%;left:${(-cx / cs) * 100}%;top:${(-cy / cs) * 100}%;object-fit:fill">` +
      `</div>`;
  };
  // 銅版画風の図版の、AI が描いた読めない書き込み（上下の余白の文字列など）を避けて生きものだけを残す切り抜き
  const ENGRAVING_CROPS = { 2: [0.25, 0.17, 0.72], 3: [0.04, 0.04, 0.92], 5: [0.15, 0.05, 0.735], 8: [0, 0, 1] };

  // 標本箱のように図版を格子に並べる
  const grid = (list, x, y, cols, rows, cell, gap) => {
    let out = '';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const s = list[(r * cols + c) % Math.max(list.length, 1)];
      out += plate(s, x + c * (cell + gap), y + r * (cell + gap), cell, cell);
    }
    return out;
  };

  // 16:9 の題字まわり（罫・縦書きの題字・全標本の重心から書いた表題の文字列・副題）。ruleX は罫の位置
  const coverTitle = (ruleX, top, height, subY) =>
    `<div class="rule-v" style="left:${ruleX}px;top:${top}px;height:${height}px"></div>` +
    `<div class="title-v" style="left:${ruleX + 104}px;top:${top}px;font-size:46px">読めない博物誌</div>` +
    `<div class="glyph-name" style="left:${ruleX + 248}px;top:${top}px;width:64px">${G.nameSVG(G.nameFromCoords(mean(specs.map((s) => s.coords)), 3), { size: 60, vertical: true, gap: 0.45 })}</div>` +
    `<div class="title-en" style="left:120px;top:${subY}px;font-size:30px">An Unreadable Natural History</div>`;
  // 4×2 の標本箱（1 区画 324px）。cells は [標本, 図版の番号] の並び
  const box4x2 = (cells) => cells.map(([s, k], i) => plate(s, 120 + (i % 4) * 348, 180 + Math.floor(i / 4) * 348, 324, 324, k)).join('');
  // 銅版画と接写を上下で対にする 4 体（色の違いが出るものを選んだ）
  const PAIR_IDS = [2, 3, 5, 7];
  const pairCells = () => {
    const four = PAIR_IDS.map((id) => specs.find((s) => s.id === id)).filter(Boolean);
    return [...four.map((s) => [s, 0]), ...four.map((s) => [s, 3])];
  };

  const sheets = {
    // 1:1 文字なし：主役の標本の図版を 1 枚
    icon: () => plate(lead, 112, 112, 800, 800, iconImg),

    // 1:1 銅版画の標本箱：16:9 のカバーと同じ紙と額装で 4 体を 2×2 に。書き込みのない部分だけを切り抜く
    icon_engraving: () => {
      const picks = Object.keys(ENGRAVING_CROPS).map(Number).map((id) => specs.find((s) => s.id === id)).filter(Boolean);
      return picks.slice(0, 4).map((s, i) =>
        croppedPlate(s, 64 + (i % 2) * 464, 64 + Math.floor(i / 2) * 464, 432, 432, ENGRAVING_CROPS[s.id])).join('');
    },

    // 1:1 題字入り：銅版画の標本箱にカバーと同じ題字・表題の文字列・副題を添えたもの。
    // 応募フォームの 1:1 は「文字なし」が規定なので、SNS や記事のサムネイル用
    icon_titled: () => {
      const picks = Object.keys(ENGRAVING_CROPS).map(Number).map((id) => specs.find((s) => s.id === id)).filter(Boolean);
      return picks.slice(0, 4).map((s, i) =>
        croppedPlate(s, 64 + (i % 2) * 400, 96 + Math.floor(i / 2) * 400, 372, 372, ENGRAVING_CROPS[s.id])).join('') +
        `<div class="rule-v" style="left:868px;top:96px;height:772px"></div>` +
        `<div class="title-v" style="left:900px;top:96px;font-size:44px">読めない博物誌</div>` +
        `<div class="glyph-name" style="left:902px;top:618px;width:40px">${G.nameSVG(G.nameFromCoords(mean(specs.map((s) => s.coords)), 3), { size: 60, vertical: true, gap: 0.45 })}</div>` +
        `<div class="title-en" style="left:64px;top:902px;font-size:28px">An Unreadable Natural History</div>`;
    },

    // 1:1 全面：主役の接写を余白なしで。小さな一覧でもいちばん大きく見える
    icon_full: () => plate(lead, 0, 0, 1024, 1024, iconImg, 'border:0'),

    // 1:1 標本箱：8 体の接写を 3×3 に収め、主役を中央に、最後の 1 区画は空けておく（まだ見つかっていない 1 体）
    icon_box: () => {
      const ring = [...others.slice(0, 4), null, ...others.slice(4, 7)];
      const order = [ring[0], ring[1], ring[2], ring[3], lead, ring[5], ring[6], ring[7], null];
      return order.map((s, i) => plate(s, 44 + (i % 3) * 318, 44 + Math.floor(i / 3) * 318, 300, 300, iconImg)).join('');
    },

    // 16:9 カバーアート：左に標本箱（3×2）、右に全標本の重心から書いた表題の文字列と、縦書きの題字
    cover: () =>
      grid([lead, ...others], 120, 122, 3, 2, 400, 36) +
      `<div class="rule-v" style="left:1452px;top:122px;height:836px"></div>` +
      `<div class="glyph-name" style="left:1700px;top:122px;width:64px">${G.nameSVG(G.nameFromCoords(mean(specs.map((s) => s.coords)), 3), { size: 60, vertical: true, gap: 0.45 })}</div>` +
      `<div class="title-v" style="left:1556px;top:122px;font-size:46px">読めない博物誌</div>` +
      `<div class="title-en" style="left:120px;top:992px;font-size:30px">An Unreadable Natural History</div>`,

    // 16:9 文字なし版：カバーアートから題字・名前・罫を除いたもの（構図は同じ）
    clean: () => grid([lead, ...others], 120, 122, 3, 2, 400, 36),

    // 16:9 案B：8 体すべての銅版画を図鑑の番号順に 4×2 で
    cover_all: () => box4x2(specs.slice(0, 8).map((s) => [s, 0])) + coverTitle(1528, 180, 672, 912),
    clean_all: () => box4x2(specs.slice(0, 8).map((s) => [s, 0])) + `<div class="rule-v" style="left:1528px;top:180px;height:672px"></div>`,

    // 16:9 案C：上段に銅版画、下段に同じ標本の接写。図鑑の体裁と、生きものの存在感を両方見せる
    cover_pair: () => box4x2(pairCells()) + coverTitle(1528, 180, 672, 912),
    clean_pair: () => box4x2(pairCells()) + `<div class="rule-v" style="left:1528px;top:180px;height:672px"></div>`,

    // 2:3 縦長キービジュアル：主図版、縦書きの名前、題字
    poster: () =>
      plate(lead, 90, 110, 680, 680) +
      `<div class="glyph-name" style="left:820px;top:120px;width:84px">${G.nameSVG(nameOf(lead), { size: 60, vertical: true, gap: 0.45 })}</div>` +
      grid(others, 90, 840, 3, 1, 213, 20) +
      `<div class="title-v" style="right:96px;top:860px;font-size:40px">読めない博物誌</div>` +
      `<div class="title-en" style="left:90px;top:1360px;font-size:26px">An Unreadable Natural History</div>`,
  };
  const sizes = { icon: '1:1  1024×1024（文字なし）', icon_full: '1:1  全面', icon_box: '1:1  標本箱', icon_engraving: '1:1  銅版画の標本箱', icon_titled: '1:1  題字入り（SNS・記事用）', cover_all: '16:9  案B 8体', clean_all: '16:9  案B 文字なし', cover_pair: '16:9  案C 銅版画と接写', clean_pair: '16:9  案C 文字なし', cover: '16:9  1920×1080 カバーアート', clean: '16:9  1920×1080 文字なし版', poster: '2:3  1000×1500（任意）' };

  const root = document.getElementById('sheets');
  if (only) document.body.classList.add('single');
  for (const [key, draw] of Object.entries(sheets)) {
    if (only && only !== key) continue;
    root.insertAdjacentHTML('beforeend', `<div class="label">${sizes[key]}${D.mock ? '　— 試作データ（図版なし）' : ''}</div><div class="sheet" id="${key}">${draw()}</div>`);
  }
})();
</script>
</body>
</html>
